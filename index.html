      color: white;
      background:

    .heart {
      position: fixed;
      bottom: -40px;
      color: rgba(255, 105, 150, 0.35);
      font-size: 24px;
      animation: floatUp 10s linear infinite;
      pointer-events: none;
    }

    .heart:nth-child(1) {
      left: 10%;
      animation-delay: 1s;
    }

    .heart:nth-child(2) {
      left: 30%;
      animation-delay: 4s;
    }

    .heart:nth-child(3) {
      left: 50%;
      animation-delay: 2s;
    }

    .heart:nth-child(4) {
      left: 72%;
      animation-delay: 5s;
    }

    .heart:nth-child(5) {
      left: 90%;
      animation-delay: 3s;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }

    .container {

      z-index: 2;

      box-shadow: 0 25px 70px rgba(0,0,0,0.5);
    }

    .badge {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 30px;
      background: rgba(255,70,130,0.18);
      color: #ffabc7;
      font-size: 13px;
      margin-bottom: 15px;

      line-height: 1.1;
      margin-bottom: 12px;
    }

    .pink {
      color: #ff719e;
    }

    .description {
      color: #d8c5ce;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .image-wrapper {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 15px 45px rgba(0,0,0,0.55);
    }
